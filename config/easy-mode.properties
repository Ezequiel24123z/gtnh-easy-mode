# GTNH Easy Mode: preset tecnologico rapido
# Informativo: no es leído automáticamente por GTNH ni por terceros.
# La implementación propia tendrá que validar y escribir la config real de Forge/GTNHLib.

[machine-time]
recipeDurationMultiplier=0.20
euPerTickMultiplier=1.00
preserveVoltageTier=true
minimumDurationTicks=1
applyToGregTech=true
applyToZenScript=true
applyToAssemblyLine=true

[ezgt]
veinRichness=4.0
gtCasingAssemblerOutputs=4.0
oreProcessingBonusOutputChances=4.0
easyCircuits=true
easyCoils=true
easyMotors=4.0

[ezminer-server]
bigRadius=32
blockLimit=16384
breakPerTick=64
cachedBreakPerTick=256
crazyMode=true
enableChainChunkLoading=true
addExhaustion=0.0
searchWorkerThreads=8
chainCooldownTicks=0
enableUnlimitedOreFortune=true

[cropsnh]
growthRateMultiplier=2.0
breedingChance=1
enableWeeds=false
weedsCanOvertakePlants=false

[bees]
forestryMode=EASY
magicBeesManaMultiplier=0.1
magicBeesTicksMultiplier=0.1
magicBeesDrainerTicks=20
gendustryMutatronMj=200000
gendustryMutatronMutagenMb=500
gendustryMutatronLabwareChance=0
gendustryMutatronNaturalDegradeChance=0
gendustryMutatronArtificialDeathChance=0
gendustryMutatronSecretMutationChance=0
gendustryIndustrialApiaryMjPerTick=5
gendustryReplicatorMakePristine=true
gendustryEUSinkTier=1

[magic]
thaumcraftResearchDifficulty=-1
thaumcraftWussMode=true
thaumcraftHardModeNodes=false
botaniaPassiveDecayTime=-1
botaniaManaSpreadersSilent=true
thaumicEnergisticsEssentiaExponent=6
bloodMagicSacrificeLp=3000
bloodMagicSelfSacrificeLp=625
bloodMagicWellSacrificeLp=125
witcheryCovenSpawnWeight=10
witcherySleepingPercent=1
witcheryVampireKeepAliveMins=1
witcheryVampireHunterChance=0.05

[server]
fly=true
rtp=true
tpa=true
back=true
home=true
chunks=true

[guards]
preserveTechTiers=true
preserveRecipeChains=true
preserveQuestProgression=true
