// GTNH Easy Mode: faster and more tolerant Industrial Apiary upgrades

cfg Upgrades {
    cfg prod {
        id = 0
        max = 8
        production *= 2.0
        energy *= 1.1
    }

    cfg life {
        id = 1
        max = 8
        energy *= 1.05
        lifespan /= 10
    }

    cfg flowering {
        id = 2
        max = 8
        energy *= 1.05
        flowering *= 2.0
    }

    cfg territory {
        id = 3
        max = 8
        energy *= 1.05
        territory *= 3.0
    }

    cfg humidifier {
        id = 4
        max = 8
        energy *= 1.05
        humidity += 0.25
    }

    cfg dryer {
        id = 5
        max = 8
        energy *= 1.05
        humidity -= 0.25
    }

    cfg heater {
        id = 6
        max = 8
        energy *= 1.05
        temperature += 0.25
    }

    cfg cooler {
        id = 7
        max = 8
        energy *= 1.05
        temperature -= 0.25
    }

    cfg sealing {
        id = 10
        max = 1
        energy *= 1.05
        sealed = Y
    }

    cfg light {
        id = 11
        max = 1
        energy *= 1.05
        selfLighted = Y
    }

    cfg sky {
        id = 12
        max = 1
        energy *= 1.05
        sunlightSimulated = Y
    }

    cfg stabilizer {
        id = 19
        max = 1
        energy *= 1.1
        geneticDecay *= 0
    }
}
